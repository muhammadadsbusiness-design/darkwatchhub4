<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <linearGradient id="dw-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a38"/>
      <stop offset="100%" stop-color="#b8000b"/>
    </linearGradient>
    <filter id="dw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(10, 8)">
    <!-- Hexagon Outer -->
    <path d="M27 2 L50 15 L50 39 L27 52 L4 39 L4 15 Z" fill="#141419" stroke="url(#dw-red-grad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner glowing eye / play symbol -->
    <path d="M21 18 L38 27 L21 36 Z" fill="url(#dw-red-grad)" filter="url(#dw-glow)"/>
    <circle cx="27" cy="27" r="2.5" fill="#ffffff"/>
  </g>
  
  <!-- Text: DARK WATCH -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1">
    <text x="75" y="44" fill="#ffffff">DARK</text>
    <text x="160" y="44" fill="#ff1f2d" filter="url(#dw-glow)">WATCH</text>
  </g>
  
  <!-- Subtitle: ANIME & CARTOON -->
  <text x="76" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#8e8e9f" letter-spacing="3">ANIME &amp; CARTOON</text>
</svg>
